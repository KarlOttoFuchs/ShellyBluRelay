# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2026-01-13"
project: "ESP32C3 BLE Relay Module"
project_type: "greenfield"
selected_track: "method"
field_type: "greenfield"
workflow_path: "bmad-method-greenfield"

workflow_status:
  # Phase 1: Analysis (Optional)
  - phase: 1
    name: "Analysis (Optional)"
    workflows:
      - id: "brainstorm-project"
        name: "Brainstorming Session"
        agent: "analyst"
        command: "/bmad:core:workflows:brainstorming"
        status: "docs/brainstorming-session-results.md"

      - id: "research"
        name: "Research"
        agent: "analyst"
        command: "/bmad:bmm:workflows:research"
        status: "docs/RESEARCH-REPORT-Python-CLI-Frameworks.md"

      - id: "product-brief"
        name: "Product Brief"
        agent: "analyst"
        command: "/bmad:bmm:workflows:create-product-brief"
        status: "docs/brief.md"

  # Phase 2: Planning
  - phase: 2
    name: "Planning"
    workflows:
      - id: "prd"
        name: "Product Requirements Document"
        agent: "pm"
        command: "/bmad:bmm:workflows:prd"
        status: "_bmad-output/planning-artifacts/prd.md"
        output: "Product Requirements Document with FRs and NFRs"

      - id: "create-ux-design"
        name: "UX Design"
        agent: "ux-designer"
        command: "/bmad:bmm:workflows:create-ux-design"
        status: "conditional"
        note: "Determined after PRD - Python CLI interface design"

  # Phase 3: Solutioning
  - phase: 3
    name: "Solutioning"
    workflows:
      - id: "create-architecture"
        name: "Architecture"
        agent: "architect"
        command: "/bmad:bmm:workflows:create-architecture"
        status: "required"
        output: "System architecture document"
        note: "Firmware state machine, BTHome parser, Python CLI architecture"

      - id: "create-epics-and-stories"
        name: "Epics & Stories"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-epics-and-stories"
        status: "required"
        note: "Break down PRD into implementable stories"

      - id: "test-design"
        name: "Test Design"
        agent: "tea"
        command: "/bmad:bmm:workflows:testarch-test-design"
        status: "optional"
        output: "System-level testability review"

      - id: "implementation-readiness"
        name: "Implementation Readiness Check"
        agent: "architect"
        command: "/bmad:bmm:workflows:check-implementation-readiness"
        status: "required"
        note: "Validates PRD + Architecture + Epics ready for implementation"

  # Phase 4: Implementation
  - phase: 4
    name: "Implementation"
    workflows:
      - id: "sprint-planning"
        name: "Sprint Planning"
        agent: "sm"
        command: "/bmad:bmm:workflows:sprint-planning"
        status: "required"
        note: "Creates sprint-status.yaml - subsequent work tracked there"
